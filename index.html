<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جاري فتح اللعبة...</title>

  <!-- ✅ تحويل فوري جدًا حتى قبل ما ينرسم أي شيء -->
  <script>
    (function(){
      var target = "start.html";
      var v = Date.now();
      try{
        var u = new URL(target, location.href);
        u.searchParams.set("v", String(v));
        location.replace(u.toString());
      }catch(e){
        location.replace(target + "?v=" + v);
      }
    })();
  </script>

  <!-- ✅ Backup لو المتصفح تأخر في تنفيذ JS -->
  <meta http-equiv="refresh" content="0; url=start.html" />

  <!-- ✅ ما في أي واجهة تُعرض -->
  <style>
    html,body{margin:0;height:100%;background:#1f4fa3}
    body{display:none}
  </style>
</head>
<body></body>
</html>
